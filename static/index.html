<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="layout">
    <!-- Simple Sidebar: Optional files -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark">A</span>
          <span class="brand-name">AI Chat</span>
        </div>
        <button type="button" class="icon-close mobile-only" id="closeSidebarBtn" aria-label="Close menu">&times;</button>
      </div>

      <button type="button" class="upload-btn" id="uploadTriggerBtn">
        + Attach PDF or Notes (Optional)
      </button>
      <input
        type="file"
        id="fileInput"
        accept=".pdf,.md,.markdown,.txt"
        multiple
        hidden
      />
      <div class="upload-feedback" id="uploadStatus"></div>

      <div class="files-section">
        <div class="files-header">
          <span>Attached files</span>
          <button type="button" class="text-btn" id="toggleAllDocsBtn" hidden>All</button>
        </div>
        <ul class="file-list" id="docList"></ul>
        <p class="no-files" id="noFilesMsg">No files attached. You can ask anything directly, or attach a PDF anytime.</p>
      </div>
    </aside>

    <!-- Main Chat Canvas -->
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button type="button" class="icon-btn mobile-only" id="menuBtn" aria-label="Open files">&#9776;</button>
          <div class="mode-pills" role="group" aria-label="Mode">
            <button type="button" class="pill-btn active" data-provider="ollama">Offline</button>
            <button type="button" class="pill-btn" data-provider="gemini">Online</button>
          </div>
          <select id="styleSelect" class="style-select" title="Explanation style">
            <option value="simple">Style: Simple</option>
            <option value="detailed">Style: Detailed</option>
            <option value="hinglish">Style: Hinglish</option>
            <option value="notes">Style: Exam Notes</option>
          </select>
          <button type="button" class="status-pill" id="settingsBtn" title="Model & API settings">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">Setup</span>
            <span class="gear">&#9881;</span>
          </button>
        </div>

        <button type="button" class="new-chat-btn" id="clearChatBtn">New chat</button>
      </header>

      <div class="chat-scroll" id="messages">
        <div class="welcome" id="emptyState">
          <h1>Ask anything</h1>
          <p>Chat freely using Gemini (Online) or Ollama (Offline)—or attach a PDF anytime.</p>
          <div class="suggestions">
            <button type="button" class="suggestion-btn">Explain how REST APIs work simply</button>
            <button type="button" class="suggestion-btn">Write a clean Python function to sort a list</button>
            <button type="button" class="suggestion-btn">Give me a 5-minute study plan for SQL</button>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <button type="button" class="attach-btn" id="attachBtn" title="Attach PDF or Notes (optional)">+</button>
          <textarea
            id="questionInput"
            rows="1"
            placeholder="Ask anything..."
            required
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">&#8593;</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Simple Settings Modal -->
  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" class="icon-close" id="closeSettingsBtn" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <p class="status-note" id="statusDetail"></p>

        <div class="field" id="apiKeyGroup" hidden>
          <label for="apiKeyInput">Gemini API Key (for Online mode)</label>
          <input
            type="password"
            id="apiKeyInput"
            placeholder="Paste your Gemini API key..."
            autocomplete="off"
          />
          <small id="apiKeyHint">Saved only in this browser.</small>
        </div>

        <div class="field">
          <label for="modelSelect">AI Model</label>
          <select id="modelSelect"></select>
        </div>

        <div class="field">
          <label for="customInstructionInput">How should the AI explain? (Optional)</label>
          <textarea
            id="customInstructionInput"
            rows="2"
            placeholder="e.g., Explain like I'm a beginner, use real-life analogies, keep it short..."
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="primary-btn" id="doneSettingsBtn">Done</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
